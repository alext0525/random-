<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpaceScan</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --text:#e6e8eb; --muted:#8b93a0; --border:#2b3038; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:8px; padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--border); align-items:center; flex-wrap:wrap; }
  input { flex:1; min-width:200px; padding:7px 10px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; }
  button, select { padding:7px 12px; background:#3b6fd4; color:#fff; border:0; border-radius:6px; cursor:pointer; }
  select { background:var(--bg); color:var(--text); border:1px solid var(--border); }
  button:disabled { opacity:.5; cursor:default; }
  #bar { display:flex; gap:6px; padding:8px 12px; color:var(--muted); flex-wrap:wrap; align-items:center; }
  #bar a { color:#7aa2f7; cursor:pointer; }
  #bar .total { margin-left:auto; color:var(--text); }
  main { flex:1; display:flex; min-height:0; }
  #map { flex:1; position:relative; margin:0 0 12px 12px; background:#000; border-radius:6px; overflow:hidden; }
  #side { width:300px; margin:0 12px 12px; overflow:auto; background:var(--panel); border-radius:6px; }
  .tile { position:absolute; border:1px solid #0009; overflow:hidden; cursor:pointer; padding:3px 5px; font-size:12px; color:#fff; text-shadow:0 1px 2px #000a; line-height:1.25; }
  .tile:hover { outline:2px solid #fff; z-index:5; }
  .tile b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile span { opacity:.85; }
  .row { display:flex; gap:8px; padding:6px 10px; border-bottom:1px solid var(--border); cursor:pointer; align-items:center; }
  .row:hover { background:#262a32; }
  .row .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .s { color:var(--muted); white-space:nowrap; }
  .dot { width:10px; height:10px; border-radius:2px; flex:none; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:20px; }
  @media (max-width:800px){ main{flex-direction:column} #side{width:auto;margin:0 12px 12px;max-height:35vh} #map{margin:0 12px 12px} }
</style>
</head>
<body>
<header>
  <select id="drives"></select>
  <input id="path" placeholder="Folder to scan, e.g. C:\Users\you">
  <button id="scan">Scan</button>
</header>
<div id="bar"></div>
<main>
  <div id="map"><div id="msg">Pick a drive or paste a folder path, then press Scan.</div></div>
  <div id="side"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = b => { const u=['B','KB','MB','GB','TB']; let i=0; while(b>=1024&&i<4){b/=1024;i++;} return b.toFixed(i?1:0)+' '+u[i]; };
const COLORS = ['#3b6fd4','#2a9d8f','#c9793a','#8e5bd0','#c2456b','#5c9c3a','#b8a12e','#3e8fb0'];
let current = null, crumbs = [];

async function api(u){ const r = await fetch(u); return r.json(); }

async function init(){
  const d = await api('/api/drives');
  $('drives').innerHTML = '<option value="">Drives…</option>' + d.drives.map(x=>`<option>${x}</option>`).join('');
  $('path').value = d.home;
  $('drives').onchange = e => { if(e.target.value) $('path').value = e.target.value; };
}

$('scan').onclick = async () => {
  const p = $('path').value.trim(); if(!p) return;
  const r = await api('/api/scan?path='+encodeURIComponent(p));
  if(r.error){ $('map').innerHTML = `<div id="msg">${r.error}</div>`; return; }
  $('scan').disabled = true;
  $('map').innerHTML = '<div id="msg">Scanning…</div>';
  const t = setInterval(async () => {
    const s = await api('/api/status');
    if(s.running){ $('msg') && ($('msg').textContent = `Scanning… ${s.files.toLocaleString()} files`); return; }
    clearInterval(t); $('scan').disabled = false;
    crumbs = []; open(p);
  }, 500);
};

async function open(path){
  const n = await api('/api/node?path='+encodeURIComponent(path));
  if(n.error) return;
  current = n;
  const i = crumbs.findIndex(c => c.path === path);
  if(i >= 0) crumbs = crumbs.slice(0, i+1); else crumbs.push({path, name:n.name});
  render();
}

function render(){
  const n = current;
  $('bar').innerHTML = crumbs.map((c,i)=>`<a data-p="${encodeURIComponent(c.path)}">${c.name}</a>`).join(' › ')
    + `<span class="total">${fmt(n.size)} · ${n.count.toLocaleString()} files</span>`;
  document.querySelectorAll('#bar a').forEach(a => a.onclick = () => open(decodeURIComponent(a.dataset.p)));
  const kids = n.children.filter(c => c.size > 0);
  $('side').innerHTML = kids.map((c,i)=>`<div class="row" data-i="${i}"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>
    <span class="n" title="${c.path||''}">${c.dir?'📁 ':''}${esc(c.name)}</span><span class="s">${fmt(c.size)} · ${(c.size/n.size*100).toFixed(1)}%</span></div>`).join('') || '<div class="row">Empty</div>';
  document.querySelectorAll('.row[data-i]').forEach(r => r.onclick = () => { const c = kids[r.dataset.i]; if(c.dir) open(c.path); });
  drawMap(kids);
}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function drawMap(kids){
  const el = $('map'); el.innerHTML = '';
  if(!kids.length){ el.innerHTML = '<div id="msg">Nothing here.</div>'; return; }
  const W = el.clientWidth, H = el.clientHeight, total = kids.reduce((a,c)=>a+c.size,0);
  const items = kids.map((c,i)=>({c,i,a:c.size/total*W*H}));
  squarify(items, {x:0,y:0,w:W,h:H}).forEach(r => {
    const {c,i} = r.item, d = document.createElement('div');
    d.className = 'tile';
    Object.assign(d.style, {left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px',
      background: c.dir ? COLORS[i%COLORS.length] : shade(COLORS[i%COLORS.length])});
    d.title = `${c.path||c.name}\n${fmt(c.size)}`;
    if(r.w>50 && r.h>28) d.innerHTML = `<b>${esc(c.name)}</b><span>${fmt(c.size)}</span>`;
    if(c.dir) d.onclick = () => open(c.path);
    el.appendChild(d);
  });
}
function shade(hex){ const n=parseInt(hex.slice(1),16); const f=v=>Math.round(v*.6); return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`; }

// Squarified treemap (Bruls et al.)
function squarify(items, rect){
  const out = []; let rest = items.slice(), r = {...rect};
  const worst = (row, side) => { const s = row.reduce((a,x)=>a+x.a,0), mx = Math.max(...row.map(x=>x.a)), mn = Math.min(...row.map(x=>x.a));
    return Math.max(side*side*mx/(s*s), s*s/(side*side*mn)); };
  while(rest.length){
    const side = Math.min(r.w, r.h); let row = [rest[0]]; let i = 1;
    while(i < rest.length && worst([...row, rest[i]], side) <= worst(row, side)) row.push(rest[i++]);
    rest = rest.slice(row.length);
    const s = row.reduce((a,x)=>a+x.a,0);
    if(r.w >= r.h){ const w = s/r.h; let y = r.y; row.forEach(x=>{ const h = x.a/w; out.push({item:x,x:r.x,y,w,h}); y+=h; }); r = {x:r.x+w,y:r.y,w:r.w-w,h:r.h}; }
    else { const h = s/r.w; let x0 = r.x; row.forEach(x=>{ const w = x.a/h; out.push({item:x,x:x0,y:r.y,w,h}); x0+=w; }); r = {x:r.x,y:r.y+h,w:r.w,h:r.h-h}; }
  }
  return out;
}

window.addEventListener('resize', () => current && render());
init();
</script>
</body>
</html>
