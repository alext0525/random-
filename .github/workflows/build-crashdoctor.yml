name: Build CrashDoctor exe
on:
  push:
    branches: [claude/dazzling-edison-pf5euw]
    paths: [crashdoctor.py, crashdoctor.html, .github/workflows/build-crashdoctor.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller anthropic
      - run: python -c "import crashdoctor"
      - run: pyinstaller --onefile --noconsole --collect-submodules anthropic --add-data "crashdoctor.html;." --name CrashDoctor crashdoctor.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: crashdoctor-latest
          name: CrashDoctor (latest build)
          files: dist/CrashDoctor.exe
