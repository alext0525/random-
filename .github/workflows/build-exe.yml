name: Build Windows exe
on:
  push:
    branches: [claude/stoic-ride-327tid]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name SpaceScan --add-data "index.html;." spacescan.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SpaceScan (latest build)
          files: dist/SpaceScan.exe
